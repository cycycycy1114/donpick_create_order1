<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>預購下單表單</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background: #f7f6f3; color: #37352f; }
    .card { background: white; padding: 24px; border-radius: 8px; max-width: 420px; margin: auto; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    h2 { margin-top: 0; font-size: 20px; text-align: center; color: #2eaadc; }
    label { display: block; margin: 12px 0 4px; font-weight: 600; font-size: 14px; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    .price-info { background: #f0f7ff; padding: 10px; border-radius: 6px; margin: 12px 0; font-size: 14px; color: #0066cc; }
    button { width: 100%; padding: 12px; background: #2eaadc; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #msg { margin-top: 12px; text-align: center; font-weight: bold; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🛍️ 線上下單預購表單</h2>
    <form id="orderForm">
      <label>LINE / 買家暱稱</label>
      <input type="text" id="nickname" required placeholder="例如：cy">

      <label>選擇商品</label>
      <select id="productSelect" required>
        <option value="">載入商品中...</option>
      </select>

      <label>規格 / 款式</label>
      <select id="specSelect" required>
        <option value="預設規格">預設規格</option>
        <option value="單品">單品</option>
        <option value="組合包">組合包</option>
        <!-- 您可依需求自由增減或修飾規格項目 -->
      </select>

      <label>數量</label>
      <input type="number" id="quantity" value="1" min="1" required>

      <label>取貨方式</label>
      <select id="deliverySelect" required>
        <option value="7-11 店到店">7-11 店到店</option>
        <option value="全家 店到店">全家 店到店</option>
        <option value="宅配到府">宅配到府</option>
        <option value="面交">面交</option>
      </select>

      <div class="price-info">
        單價：\$<span id="unitPrice">0</span> | 總金額：\$<span id="totalPrice">0</span>
      </div>

      <button type="submit" id="btn">送出訂單</button>
    </form>
    <div id="msg"></div>
  </div>

  <script>
    let productList = [];

    // 載入商品資料庫 (A 資料庫)
    async function loadProducts() {
      try {
        const res = await fetch('/api/get-products');
        productList = await res.json();
        const select = document.getElementById('productSelect');
        select.innerHTML = '<option value="">請選擇商品...</option>';
        productList.forEach((p, idx) => {
          const opt = document.createElement('option');
          opt.value = idx; // 用索引值對應商品物件
          opt.textContent = `${p.name} ($${p.price})`;
          select.appendChild(opt);
        });
      } catch (e) {
        document.getElementById('productSelect').innerHTML = '<option>商品載入失敗</option>';
      }
    }

    // 計算價格邏輯
    function updatePrice() {
      const idx = document.getElementById('productSelect').value;
      const qty = parseInt(document.getElementById('quantity').value) || 1;
      if (idx !== "" && productList[idx]) {
        const price = productList[idx].price || 0;
        document.getElementById('unitPrice').innerText = price;
        document.getElementById('totalPrice').innerText = price * qty;
      } else {
        document.getElementById('unitPrice').innerText = '0';
        document.getElementById('totalPrice').innerText = '0';
      }
    }

    document.getElementById('productSelect').addEventListener('change', updatePrice);
    document.getElementById('quantity').addEventListener('input', updatePrice);

    loadProducts();

    // 提交訂單
    document.getElementById('orderForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const msg = document.getElementById('msg');
      const idx = document.getElementById('productSelect').value;
      if (idx === "") return;

      const selectedProduct = productList[idx];
      const qty = parseInt(document.getElementById('quantity').value);

      btn.disabled = true;
      msg.innerText = '處理中...';

      const data = {
        nickname: document.getElementById('nickname').value,
        product: selectedProduct.name,
        price: selectedProduct.price,
        quantity: qty,
        totalPrice: selectedProduct.price * qty,
        spec: document.getElementById('specSelect').value,
        delivery: document.getElementById('deliverySelect').value
      };

      try {
        const res = await fetch('/api/create-order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        if (res.ok) {
          msg.style.color = 'green';
          msg.innerText = '✅ 下單成功！';
          document.getElementById('orderForm').reset();
          updatePrice();
        } else {
          throw new Error('下單失敗');
        }
      } catch (err) {
        msg.style.color = 'red';
        msg.innerText = '❌ ' + err.message;
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
